:root{--g:#e8650a;--g2:#fdeee3;--line:#dcdfe3;--tx:#1f2328;--mu:#6b7280;--bg:#f6f7f9;--open:#e53935;--prog:#f08c00;--done:#2e7d32}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Sarabun,system-ui,sans-serif;color:var(--tx);background:#fff;font-size:15px}
button,select,input,textarea{font-family:inherit;font-size:14px}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;width:100%}
body{overflow:hidden}
.exp .btn{min-width:0;white-space:normal}
header,.tb{min-width:0}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;letter-spacing:.5px;margin:0 8px 0 0;font-weight:700}
.sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;cursor:pointer;white-space:nowrap;color:var(--tx)}
.btn:hover{background:#f3f4f6}
.btn.pri{background:var(--g);border-color:var(--g);color:#fff;font-weight:600}
.btn.pri:hover{filter:brightness(.92)}
.brand{display:flex;align-items:center;gap:8px;margin-right:6px}.brand img{width:30px;height:30px}.brand span{font-weight:800;font-size:19px;letter-spacing:-.3px;color:#1f1f1f;font-style:italic}.brand b{color:#e8650a}
.drop .lg{width:200px;display:block;margin:0 auto 4px}
.btn.on{background:#1565c0;border-color:#1565c0;color:#fff}
.btn.red{color:#c62828}
.btn.sm{padding:4px 9px;font-size:13px}
select.in,input.in,textarea.in{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;width:100%}
.tb{display:flex;gap:6px;align-items:center;padding:8px 12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.zl{min-width:48px;text-align:center;color:var(--mu)}
.tabs{display:flex;gap:4px;padding:6px 12px 0;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--bg)}
.tab{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;background:#eef0f3;cursor:pointer;white-space:nowrap;font-size:13px}
.tab.act{background:#fff;font-weight:600}
.tab .x{color:var(--mu);cursor:pointer;padding:0 2px}
.tab .x:hover{color:#c62828}
.main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;overflow:hidden;background:var(--bg);touch-action:none;cursor:grab}
#stage.pt{cursor:crosshair}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#dwg{display:block;user-select:none;-webkit-user-drag:none;box-shadow:0 2px 14px rgba(0,0,0,.12);background:#fff}
#pins{position:absolute;inset:0}
.pin{position:absolute;width:30px;height:40px;transform:translate(-50%,-100%) scale(var(--inv,1));transform-origin:50% 100%;cursor:pointer;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.pin svg{display:block}
.pin.sel svg path{stroke:#1565c0;stroke-width:3}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.drop{border:1.5px dashed #b8bec6;border-radius:14px;background:#fff;padding:26px 34px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.drop h3{margin:8px 0 4px}
.drop p{margin:0 0 14px;color:var(--mu)}
#stage.dragover .drop{border-color:var(--g);background:var(--g2)}
.hint{padding:4px 12px;font-size:12.5px;color:var(--mu);border-top:1px solid var(--line)}
aside{width:350px;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#fff}
.sum{padding:12px 12px 8px;font-size:14px;color:var(--mu)}.sum b{color:var(--tx);font-size:17px}
.flt{display:flex;gap:6px;padding:0 10px 8px;align-items:center;flex-wrap:wrap;font-size:13px}
.list{flex:1;overflow:auto;padding:0 10px 10px}
.card{display:flex;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;cursor:pointer}
.card:hover{border-color:#9aa3ad}
.card.sel{border-color:#1565c0;box-shadow:0 0 0 2px rgba(21,101,192,.15)}
.card .th{width:58px;height:58px;border-radius:8px;background:#eef0f3 center/cover no-repeat;flex:none;display:flex;align-items:center;justify-content:center;color:#9aa3ad;font-size:11px}
.card .bd{flex:1;min-width:0}
.card .t{display:flex;gap:6px;align-items:center;font-weight:600}
.card .d{font-size:13px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.no{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:12px;color:#fff;font-size:12.5px;font-weight:700;padding:0 6px}
.chip{font-size:11.5px;border-radius:20px;padding:1px 8px;font-weight:600}
.exp{padding:10px;border-top:1px solid var(--line);display:grid;gap:6px}
.muted{color:var(--mu);font-size:13px}
.modal-bg{position:fixed;inset:0;background:rgba(15,20,25,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal{background:#fff;border-radius:14px;width:min(640px,100%);max-height:calc(100vh - 24px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal .mh{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px}
.opt{display:block;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}.opt:has(input:checked){border-color:var(--g);background:var(--g2)}
.frow{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;flex-wrap:wrap}
.modal .mb{padding:14px 16px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.modal .mf{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.f{display:flex;flex-direction:column;gap:4px}
.f.full{grid-column:1/-1}
.f label{font-size:13px;color:var(--mu);font-weight:500}
.phs{display:flex;gap:8px;flex-wrap:wrap}
.ph{position:relative;width:96px;height:96px;border-radius:8px;background:#eef0f3 center/cover no-repeat;border:1px solid var(--line)}
.ph .del{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:11px;border:none;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:22px;padding:0}
.ph .ord{position:absolute;left:4px;bottom:3px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;border-radius:6px;padding:0 5px}
.addph{width:96px;height:96px;border:1.5px dashed #b8bec6;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--mu);cursor:pointer;font-size:12.5px;text-align:center}
.addph:hover{border-color:var(--g);color:var(--g)}
.logo-prev{height:54px;border:1px solid var(--line);border-radius:8px;background:#fafafa center/contain no-repeat;flex:1}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1f2328;color:#fff;padding:9px 16px;border-radius:10px;font-size:14px;z-index:80;display:none;max-width:90vw}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:#fff;padding:6px 10px;cursor:pointer}
.seg button.on{background:var(--g);color:#fff}
@media (max-width:860px){
 .main{flex-direction:column}
 aside{width:auto;height:42vh;border-left:none;border-top:1px solid var(--line)}
 .frow{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;flex-wrap:wrap}
.modal .mb{grid-template-columns:1fr}
}
.tool.on{background:#1565c0;border-color:#1565c0;color:#fff}
.dd{position:relative}
.menu{position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:4px;z-index:30;display:none;min-width:200px}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;border:none;background:none;padding:7px 10px;border-radius:7px;cursor:pointer;color:var(--tx)}
.menu button:hover,.menu button.on{background:#eef4ff}
.sw{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:10px}
.sw button{width:20px;height:20px;border-radius:6px;border:2px solid transparent;cursor:pointer;padding:0}
.sw button.on{border-color:#111;box-shadow:inset 0 0 0 2px #fff}
.sz button{padding:5px 10px}
.lbl{font-size:13px;color:var(--mu)}
input.n{width:74px;border:1px solid var(--line);border-radius:8px;padding:5px 8px}
#stage{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#stage.draw{cursor:crosshair}
#stage.erase{cursor:cell}
#pins{pointer-events:none}
.pin{pointer-events:auto}
#mk{position:absolute;left:0;top:0;overflow:visible}
#mk .hit{fill:none;stroke:transparent;stroke-width:calc(16px * var(--inv,1));pointer-events:stroke}
#mk .selbox{fill:none;stroke:#1565c0;stroke-dasharray:6 4;stroke-width:calc(1.5px * var(--inv,1));pointer-events:none}
#mkLive{pointer-events:none}
.pbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#1f2328;color:#fff;border-radius:10px;padding:6px 8px 6px 12px;display:flex;gap:8px;align-items:center;font-size:14px;z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:nowrap}
.pbar[hidden]{display:none}
.pbar button{border:none;border-radius:7px;padding:4px 10px;cursor:pointer;font-family:inherit;font-size:13px}
.pbar .ok{background:#2e7d32;color:#fff}
.scinfo{font-size:12.5px;color:var(--mu)}
.scinfo.warn{color:#c62828}
.sb{position:absolute;z-index:4;background:rgba(0,0,0,.035)}
.sb.v{right:0;top:0;bottom:12px;width:12px}.sb.h{left:0;right:12px;bottom:0;height:12px}
.sb .th{position:absolute;background:rgba(0,0,0,.28);border-radius:6px;cursor:pointer;touch-action:none}
.sb .th:hover{background:rgba(0,0,0,.45)}.sb.v .th{left:2px;right:2px}.sb.h .th{top:2px;bottom:2px}
@media (pointer:coarse){.sb.v{width:16px}.sb.h{height:16px}}
.seg.st button.on{background:var(--sc);color:#fff}
.seg.st{display:flex}.seg.st button{flex:1}
header,.tb{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin}
header>*,.tb>*{flex:none}
.menu{position:fixed}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.55);z-index:70;display:none;align-items:center;justify-content:center;backdrop-filter:blur(1px)}
#busy.on{display:flex}
#busy .bx{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 22px;box-shadow:0 10px 40px rgba(0,0,0,.15);display:flex;gap:12px;align-items:center;font-weight:600}
#busy .sp2{width:22px;height:22px;border:3px solid #fbd9c2;border-top-color:var(--g);border-radius:50%;animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media (max-width:860px){.modal{width:100%;max-height:100%;height:100%;border-radius:0}.modal-bg{padding:0}}
.pref{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:3px 8px}
.pref select{border:none;background:none;font-weight:600;cursor:pointer;font-family:inherit}
.pref .seg button{padding:3px 9px;font-weight:700}
#bList{display:none}
body.dev-tablet .btn{padding:9px 14px;font-size:15px}
body.dev-tablet .btn.sm{padding:7px 12px;font-size:14px}
body.dev-tablet .sw button{width:28px;height:28px}
body.dev-tablet .seg button{padding:8px 12px}
body.dev-tablet .pin{width:36px;height:48px}body.dev-tablet .pin svg{width:36px;height:48px}
body.dev-tablet aside{width:310px}
body.dev-tablet .menu button{padding:11px 12px;font-size:15px}
body.dev-mobile .main{flex-direction:column}
body.dev-mobile aside{position:fixed;left:0;right:0;bottom:0;width:auto;height:62vh;border-left:none;border-top:1px solid var(--line);z-index:20;box-shadow:0 -10px 30px rgba(0,0,0,.18);border-radius:16px 16px 0 0;transform:translateY(105%);transition:transform .25s}
body.dev-mobile.list-open aside{transform:none}
body.dev-mobile #bList{display:inline-block}
body.dev-mobile .brand span,body.dev-mobile .hint{display:none}
body.dev-mobile .btn{padding:9px 12px}
body.dev-mobile .sw button{width:28px;height:28px}
body.dev-mobile .pin{width:36px;height:48px}body.dev-mobile .pin svg{width:36px;height:48px}
body.dev-mobile .modal-bg{padding:0}body.dev-mobile .modal{width:100%;height:100%;max-height:100%;border-radius:0}body.dev-mobile .modal .mb{grid-template-columns:1fr}
body.dev-desktop .main{flex-direction:row}
body.dev-desktop aside,body.dev-tablet aside{position:static;transform:none;height:auto}
/* ---- framed layout ---- */
body{background:#eef1f5}
.app{padding:8px;gap:8px}
.card{background:#fff;border:1px solid #dde2e8;border-radius:14px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
header.hdr{padding:8px 12px;gap:10px;flex-wrap:wrap;overflow:visible;border-bottom:1px solid #dde2e8}
.hg{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hg+.hg,.brand+.hg{padding-left:10px;border-left:1px solid var(--line)}
.toolcard{display:flex;flex-wrap:wrap;gap:8px;padding:8px;flex:none}
.grp{border:1px solid #e5e8ed;border-radius:12px;padding:5px 8px 8px;background:#fafbfc;display:flex;flex-direction:column;gap:5px}
.gl{font-size:11.5px;color:var(--mu);font-weight:700;letter-spacing:.3px;padding-left:2px}
.gi{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.main{gap:8px;min-height:0}
.stagecard{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.stagecard .tabs{background:#f6f7f9;border-bottom:1px solid var(--line);padding:6px 8px 0}
.stagecard #stage{flex:1;min-height:0}
.statusbar{display:flex;gap:12px;align-items:center;padding:5px 12px;border-top:1px solid var(--line);background:#fafbfc;min-width:0}
.statusbar .hint{padding:0;border:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.statusbar .scinfo{white-space:nowrap;flex:none}
aside.card{border:1px solid #dde2e8;overflow:hidden}
.sec-h{display:flex;align-items:center;gap:8px;padding:10px 12px;font-weight:700;border-bottom:1px solid var(--line);background:#fafbfc}
.sec-h .sum{margin-left:auto;padding:0;font-weight:400;font-size:13px}
.sec-h .sum b{font-size:14px}
aside .list{border-bottom:1px solid var(--line)}
aside .flt{padding:8px 10px}
aside .exp{border-top:none}
body.dev-mobile .app{padding:4px;gap:4px}
body.dev-mobile .toolcard{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
body.dev-mobile .toolcard::-webkit-scrollbar{display:none}
body.dev-mobile .grp{flex:none}
body.dev-mobile aside.card{border-radius:16px 16px 0 0}
</style>

<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const PINC='#e53935';
const STATUS={'Open':{c:'#e53935',bg:'#fdecea'},'In progress':{c:'#f08c00',bg:'#fff3e0'},'Closed':{c:'#2e7d32',bg:'#e8f5e9'}};
const SYSTEMS=['HVAC','Electrical','Sanitary','Fire Protection','Building Envelope','Civil / Structure','Architecture','Other'];

if(window.pdfjsLib){try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}catch(e){}}

/* ---------- downloads ---------- */
let DL=null;
try{ if(window.claude&&typeof window.claude.use==='function'){ window.claude.use('downloads').then(d=>{DL=d}).catch(()=>{}) } }catch(e){}
async function saveFile(name,blob){
  name=name.replace(/[\\/:*?"<>|]+/g,'_');
  if(DL){
    try{await DL.save({filename:name,data:blob});toast('บันทึกไฟล์แล้ว: '+name);return true}
    catch(e){ if(e&&e.code==='declined'){toast('ยกเลิกการดาวน์โหลด');return false} toast('ดาวน์โหลดไม่สำเร็จ ('+(e&&e.code||'error')+')');return false}
  }
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);return true}
  catch(e){toast('หน้านี้ดาวน์โหลดไฟล์ไม่ได้');return false}
}

/* ---------- toast & dialogs ---------- */
let tT,busyOn=false;function busy(on){busyOn=on;$('#busy').classList.toggle('on',on);if(!on)$('#busyTxt').textContent='กำลังทำงาน…'}
function toast(m,ms=2600){if(busyOn&&ms===0){$('#busyTxt').textContent=m;return}const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tT);if(ms)tT=setTimeout(()=>t.style.display='none',ms)}
function modal(html,onMount){
  const bg=document.createElement('div');bg.className='modal-bg';bg.innerHTML=`<div class="modal">${html}</div>`;
  document.body.appendChild(bg);const close=()=>bg.remove();
  bg.addEventListener('mousedown',e=>{if(e.target===bg)bg.dataset.down='1'});
  bg.addEventListener('click',e=>{if(e.target===bg&&bg.dataset.down){bg.querySelector('[data-cancel]')?.click()}bg.dataset.down=''});
  onMount&&onMount(bg.querySelector('.modal'),close);return close;
}
function ask(title,msg,{input=null,ok='ตกลง',danger=false}={}){
  return new Promise(res=>{
    modal(`<div class="mh">${esc(title)}</div><div class="mb" style="grid-template-columns:1fr"><div>${esc(msg||'')}</div>${input!==null?`<input class="in" id="askIn" value="${esc(input)}">`:''}</div>
    <div class="mf"><span class="sp"></span><button class="btn" data-cancel>ยกเลิก</button><button class="btn ${danger?'red':'pri'}" id="askOk">${esc(ok)}</button></div>`,(m,close)=>{
      const inp=m.querySelector('#askIn');if(inp){inp.focus();inp.select();inp.onkeydown=e=>{if(e.key==='Enter')m.querySelector('#askOk').click()}}
      m.querySelector('[data-cancel]').onclick=()=>{close();res(null)};
      m.querySelector('#askOk').onclick=()=>{close();res(inp?inp.value.trim():true)};
    });
  });
}

/* ---------- storage (IndexedDB, best-effort) ---------- */
let db=null;
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('dwg-annot-report',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('projects',{keyPath:'id'});d.createObjectStore('meta',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}})}
function idb(store,mode,fn){return new Promise((res,rej)=>{try{const tx=db.transaction(store,mode);const r=fn(tx.objectStore(store));tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error)}catch(e){rej(e)}})}
let META=[];const MEM={};
async function loadMeta(){ if(db){try{META=await idb('meta','readonly',s=>s.getAll())||[]}catch(e){META=[]}} META.sort((a,b)=>b.updated-a.updated) }
async function getProject(id){ if(db){try{return await idb('projects','readonly',s=>s.get(id))}catch(e){}} return MEM[id] }
let saveT=null;
function save(){P.updated=Date.now();clearTimeout(saveT);saveT=setTimeout(persist,500);renderExpInfo();const st=$('#saveSt');if(st)st.textContent='กำลังบันทึก…'}
async function persist(){
  if(!P)return; MEM[P.id]=P;
  const m={id:P.id,name:P.name,updated:P.updated,drawings:P.drawings.length,points:P.points.length,photos:P.points.reduce((s,p)=>s+p.photos.length,0),marks:(P.marks||[]).length};
  const i=META.findIndex(x=>x.id===P.id); if(i<0)META.unshift(m); else META[i]=m;
  if(db){try{await idb('projects','readwrite',s=>s.put(P));await idb('meta','readwrite',s=>s.put(m));$('#saveSt').textContent='✓ บันทึกแล้ว '+new Date(P.updated).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}catch(e){$('#saveSt').textContent='⚠ บันทึกไม่สำเร็จ';toast((e&&e.name==='QuotaExceededError')?'พื้นที่เก็บในเบราว์เซอร์เต็ม — ส่งออกไฟล์งาน แล้วลบงานเก่าที่ไม่ใช้':'บันทึกในเครื่องไม่สำเร็จ — กรุณาส่งออกไฟล์งาน (.json)',6000)}}else{const st=$('#saveSt');if(st)st.textContent='⚠ ยังไม่ได้บันทึกในเครื่อง — ส่งออกไฟล์งาน'}
  try{localStorage.setItem('dwg-annot-last',P.id)}catch(e){}
}
async function delProjectStore(id){ delete MEM[id]; META=META.filter(m=>m.id!==id); if(db){try{await idb('projects','readwrite',s=>s.delete(id));await idb('meta','readwrite',s=>s.delete(id))}catch(e){}} }

/* ---------- state ---------- */
let P=null, selId=null, mode='select', zoom=1, panX=0, panY=0, undoStack=[];
const imgCache=new Map();
function newProject(name){return {id:uid(),name,header:{title:'SITE INSPECTION REPORT',docNo:'',rev:'0',effDate:today(),logo:null,inspector:''},opts:{frame1:'location',cropPct:30,keyplan:true,exportMarks:true,cols:1,unit:'m'},drawings:[],points:[],marks:[],active:null,updated:Date.now()}}
const curDwg=()=>P&&P.drawings.find(d=>d.id===P.active);
const nextNo=()=>P.points.reduce((m,p)=>Math.max(m,+p.no||0),0)+1;
const ptsSorted=()=>[...P.points].sort((a,b)=>(+a.no)-(+b.no));
function pushUndo(){undoStack.push({points:P.points.map(p=>({...p})),marks:P.marks.map(m=>({...m,pts:m.pts.map(v=>[...v])}))});if(undoStack.length>80)undoStack.shift()}
function undo(){if(!undoStack.length){toast('ไม่มีรายการให้ย้อนกลับ');return}const u=undoStack.pop();P.points=u.points;P.marks=u.marks;selMark=null;save();renderPins();renderMarks();renderList();renderTabs()}
function normalize(p){p.marks=p.marks||[];p.opts={frame1:'location',cropPct:30,keyplan:true,exportMarks:true,cols:1,unit:'m',...(p.opts||{})};p.drawings.forEach(d=>{if(!d.scale)d.scale=defScale(d)});return p}
function loadImg(src){if(imgCache.has(src))return imgCache.get(src);const pr=new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});imgCache.set(src,pr);return pr}

/* ---------- render ---------- */
function renderProjSel(){
  $('#projSel').innerHTML=META.map(m=>`<option class="u" value="${m.id}" ${m.id===P.id?'selected':''}>${esc(m.name)}</option>`).join('');
}
function renderTabs(){
  $('#tabs').innerHTML=P.drawings.map(d=>{const n=P.points.filter(p=>p.drawingId===d.id).length;
    return `<div class="tab ${d.id===P.active?'act':''}" data-id="${d.id}" title="ดับเบิลคลิกเพื่อเปลี่ยนชื่อ"><span class="u">${esc(d.name)}</span><span class="muted">(${n})</span><span class="x" data-x="${d.id}">✕</span></div>`}).join('')
    +(P.drawings.length?`<div class="tab" id="tabAdd" style="background:transparent;border-style:dashed">+ เพิ่มแบบ</div>`:'');
  $('#tabs').style.display=P.drawings.length?'flex':'none';
}
function renderStage(){
  const d=curDwg();renderScaleCtl();updateSB();
  $('#empty').style.display=d?'none':'flex';
  $('#world').style.display=d?'block':'none';

  const d=curDwg();const dis=!d;['#scPaper','#scOrient','#scN','#scApply','#scCal','#scAll'].forEach(s=>$(s).disabled=dis);
  if(!d){$('#scInfo').textContent='';return}
  if(!d.scale)d.scale=defScale(d);const s=d.scale;
  $('#scPaper').innerHTML=(d.paperMM?`<option value="auto">PDF (${Math.round(d.paperMM.w)}×${Math.round(d.paperMM.h)})</option>`:'')+Object.keys(PAPERS).map(k=>`<option>${k}</option>`).join('');
  $('#scPaper').value=s.mode==='paper'?(s.paper==='auto'&&!d.paperMM?'A3':s.paper):(d.paperMM?'auto':'A3');
  $('#scOrient').value=s.orient||'auto';$('#scN').value=s.N||100;
  const info=$('#scInfo');info.classList.remove('warn');
  if(s.mode==='cal'){info.textContent=`✔ Calibrated: ${s.ref||''} → ${ppm(d).toFixed(2)} px/m`}
  else{const[w,h]=paperDims(d,s);const ar=d.w/d.h,pr=w/h;const k=ppm(d);
    info.textContent=`Scale 1:${s.N} · ${Math.round(w)}×${Math.round(h)} mm · ${k.toFixed(2)} px/m`+(Math.abs(ar-pr)/pr>.03?' ⚠ สัดส่วนแบบไม่ตรงกระดาษ — แนะนำ Calibrate':'');
    if(Math.abs(ar-pr)/pr>.03)info.classList.add('warn')}
}
function applyPaperScale(){
  const d=curDwg();if(!d)return;const N=parseFloat($('#scN').value);if(!(N>0)){toast('ใส่มาตราส่วนให้ถูกต้อง');return}
  const sc={mode:'paper',paper:$('#scPaper').value,orient:$('#scOrient').value,N};
  (($('#scAll').checked)?P.drawings:[d]).forEach(x=>x.scale={...sc,paper:(sc.paper==='auto'&&!x.paperMM)?'A3':sc.paper});
  save();renderScaleCtl();renderMarks();toast('ตั้งสเกล 1:'+N+' แล้ว');
}
async function calibrateFrom(m){
  const d=curDwg();const px=segLen(m.pts);drawLive(m);
  const v=await ask('Calibrate Scale',`เส้นอ้างอิงยาว ${Math.round(px)} px บนแบบ — ใส่ระยะจริง (หน่วยเมตร หรือพิมพ์หน่วย เช่น 6000mm, 450cm)`,{input:'',ok:'ตั้งสเกล'});
  drawLive(null);setMode('measure');if(!v)return;
  const mm=/^\s*([\d.,]+)\s*(mm|cm|m)?\s*$/i.exec(v);if(!mm){toast('รูปแบบตัวเลขไม่ถูกต้อง');return}
  let val=parseFloat(mm[1].replace(/,/g,''));const un=(mm[2]||'m').toLowerCase();const meters=un==='mm'?val/1000:un==='cm'?val/100:val;
  if(!(meters>0)){toast('ระยะต้องมากกว่า 0');return}
  d.scale={mode:'cal',ppm:px/meters,ref:`${Math.round(px)} px = ${v.trim()}${mm[2]?'':' m'}`,N:d.scale&&d.scale.N||100,paper:d.scale&&d.scale.paper,orient:d.scale&&d.scale.orient};
  save();renderScaleCtl();renderMarks();toast('Calibrate แล้ว: '+ppm(d).toFixed(2)+' px/m — ใช้วัดระยะได้ทันที',3500);
}

/* ---------- pointer interaction ---------- */
const ptrs=new Map();let drag=null;
const stage=$('#stage');
const toPx=(cx,cy)=>{const r=stage.getBoundingClientRect();return{x:(cx-r.left-panX)/zoom,y:(cy-r.top-panY)/zoom}};
function constrain(a,q,type,shift){
  if(!shift)return[q.x,q.y];
  if(type==='rect'||type==='ellipse'||type==='cloud'){const dx=q.x-a[0],dy=q.y-a[1],s=Math.max(Math.abs(dx),Math.abs(dy));return[a[0]+Math.sign(dx||1)*s,a[1]+Math.sign(dy||1)*s]}
  return Math.abs(q.x-a[0])>=Math.abs(q.y-a[1])?[q.x,a[1]]:[a[0],q.y];
}
function eraseAt(cx,cy,dr){const el=document.elementFromPoint(cx,cy);const mk=el&&el.closest&&el.closest('[data-mid]');if(mk){if(!dr.undo){pushUndo();dr.undo=true}P.marks=P.marks.filter(m=>m.id!==mk.dataset.mid);renderMarks()}}
stage.addEventListener('pointerdown',e=>{
  const d=curDwg();if(!d||e.target.closest('#empty,#polyBar'))return;
  if(e.pointerType==='pen'&&!penSeen){penSeen=true;setMode(mode)}
  if(e.button===2)return;
  e.preventDefault();
  try{stage.setPointerCapture(e.pointerId)}catch(_){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,t:e.pointerType});
  if(ptrs.size===2){if(drag&&(drag.type==='stroke'||drag.type==='shape'))drawLive(null);const[a,b]=[...ptrs.values()];drag={type:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y),z0:zoom};return}
  const q=toPx(e.clientX,e.clientY);
  const base={sx:e.clientX,sy:e.clientY,moved:false,q0:q};
  const panOnly=e.button===1||spaceDown||(penSeen&&e.pointerType==='touch'&&NONSEL.includes(mode));
  if(panOnly){drag={type:'pan',px:panX,py:panY,noClick:true,...base};return}
  const pin=e.target.closest('.pin');
  if(pin&&(mode==='select'||mode==='point')){drag={type:'pin',id:pin.dataset.id,undo:false,...base};return}
  if(mode==='select'){const mk=e.target.closest('[data-mid]');
    if(mk&&showMarks){selMark=mk.dataset.mid;if(selId){selId=null;renderPins();renderList()}renderMarks();drag={type:'mark',id:selMark,last:q,undo:false,...base};return}
    drag={type:'pan',px:panX,py:panY,...base};return}
  if(mode==='point'){drag={type:'pan',px:panX,py:panY,...base};return}
  if(mode==='eraser'){drag={type:'erase',undo:false,...base};eraseAt(e.clientX,e.clientY,drag);return}
  if(mode==='pen'||mode==='hl'){drag={type:'stroke',mark:newMark(mode,[[q.x,q.y]]),...base};drawLive(drag.mark);return}
  if(SHAPES.includes(mode)){drag={type:'shape',mark:newMark(mode,[[q.x,q.y],[q.x,q.y]]),...base};return}
  drag={type:'click',...base};
});
stage.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)){
    if(poly&&e.pointerType!=='touch'&&curDwg()){const q=toPx(e.clientX,e.clientY);poly.hover=poly.pts.length?constrain(poly.pts[poly.pts.length-1],q,'line',e.shiftKey):[q.x,q.y];drawPoly()}
    return}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,t:e.pointerType});
  if(!drag)return;
  if(drag.type==='pinch'){if(ptrs.size===2){const[a,b]=[...ptrs.values()];zoomAt((a.x+b.x)/2,(a.y+b.y)/2,drag.z0*Math.hypot(a.x-b.x,a.y-b.y)/drag.d0)}return}
  const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
  if(!drag.moved&&Math.hypot(dx,dy)>(drag.type==='stroke'?0:4))drag.moved=true;
  if(!drag.moved)return;
  const q=toPx(e.clientX,e.clientY);const d=curDwg();
  switch(drag.type){
    case 'pan':panX=drag.px+dx;panY=drag.py+dy;applyT();break;
    case 'pin':{const p=P.points.find(x=>x.id===drag.id);if(!p)return;if(!drag.undo){pushUndo();drag.undo=true}
      p.x=Math.min(1,Math.max(0,q.x/d.w));p.y=Math.min(1,Math.max(0,q.y/d.h));const el=stage.querySelector(`.pin[data-id="${p.id}"]`);if(el){el.style.left=p.x*d.w+'px';el.style.top=p.y*d.h+'px'}break}
    case 'mark':{const m=P.marks.find(x=>x.id===drag.id);if(!m)return;if(!drag.undo){pushUndo();drag.undo=true}
      const ddx=q.x-drag.last.x,ddy=q.y-drag.last.y;m.pts=m.pts.map(v=>[v[0]+ddx,v[1]+ddy]);drag.last=q;renderMarks();break}
    case 'erase':eraseAt(e.clientX,e.clientY,drag);break;
    case 'stroke':{const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];const pts=drag.mark.pts;
      for(const ev of (evs.length?evs:[e])){const r=toPx(ev.clientX,ev.clientY),l=pts[pts.length-1];if(Math.hypot(r.x-l[0],r.y-l[1])*zoom>=1.5)pts.push([r.x,r.y])}
      drawLive(drag.mark);break}
    case 'shape':{const m=drag.mark;m.pts[1]=constrain(m.pts[0],q,m.type,e.shiftKey);drawLive(m);
      if(m.type==='calib')setBar('เส้นอ้างอิง '+Math.round(segLen(m.pts))+' px',false);else if(m.type==='measure')setBar(fmtLen(segLen(m.pts),d),false);break}
    case 'click':
      if(mode==='measure'&&!poly){drag.type='shape';drag.mark=newMark('measure',[[drag.q0.x,drag.q0.y],[q.x,q.y]]);drawLive(drag.mark)}
      else{drag.type='pan';drag.px=panX-dx;drag.py=panY-dy;drag.noClick=true}
      break;
  }
});
function endPtr(e){
  if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  const dr=drag;if(ptrs.size>0){if(dr&&dr.type==='pinch')drag=null;return}
  drag=null;if(!dr||dr.type==='pinch'||!curDwg())return;
  const d=curDwg(),q=toPx(e.clientX,e.clientY);
  if(e.type==='pointercancel'){drawLive(null);setBar(poly?'':null);if(poly)drawPoly();return}
  switch(dr.type){
    case 'pin':selId=dr.id;selMark=null;renderMarks();if(dr.moved){save();renderList()}else{renderPins();renderList();openPoint(dr.id)}break;
    case 'pan':if(!dr.moved&&!dr.noClick){
        if(mode==='point'){if(q.x>=0&&q.x<=d.w&&q.y>=0&&q.y<=d.h)addPoint(q.x/d.w,q.y/d.h)}
        else if(selId||selMark){selId=null;selMark=null;renderPins();renderMarks();renderList()}}break;
    case 'mark':if(dr.moved)save();break;
    case 'erase':if(dr.undo)save();break;
    case 'stroke':{const m=dr.mark;if(m.pts.length===1)m.pts.push([m.pts[0][0]+.5/zoom,m.pts[0][1]]);drawLive(null);commitMark(m);break}
    case 'shape':{const m=dr.mark;drawLive(null);setBar(poly?'':null);
      if(segLen(m.pts)*zoom<4&&m.type!=='rect'&&m.type!=='ellipse'&&m.type!=='cloud')break;
      if(Math.abs(m.pts[1][0]-m.pts[0][0])*zoom<4&&Math.abs(m.pts[1][1]-m.pts[0][1])*zoom<4)break;
      if(m.type==='calib')calibrateFrom(m);else commitMark(m);break}
    case 'click':{
      if(mode==='text'){ask('ข้อความ','พิมพ์ข้อความที่จะวางบนแบบ',{input:'',ok:'วาง'}).then(t=>{if(t){const m=newMark('text',[[q.x,q.y]]);m.text=t;commitMark(m)}});break}
      if(mode==='measure'||mode==='area'){
        if(!poly)poly={type:mode,pts:[],hover:null};
        const last=poly.pts[poly.pts.length-1];const pt=last?constrain(last,q,'line',e.shiftKey):[q.x,q.y];
        if(last&&Math.hypot(pt[0]-last[0],pt[1]-last[1])*zoom<6){finishPoly();break}
        if(poly.type==='area'&&poly.pts.length>=3){const f=poly.pts[0];if(Math.hypot(pt[0]-f[0],pt[1]-f[1])*zoom<12){finishPoly();break}}
        poly.pts.push(pt);poly.hover=null;drawPoly()}
      break}
  }
}
stage.addEventListener('pointerup',endPtr);stage.addEventListener('pointercancel',endPtr);
stage.addEventListener('contextmenu',e=>{if(curDwg())e.preventDefault()});
stage.addEventListener('dblclick',async e=>{
  if(mode!=='select')return;const mk=e.target.closest('[data-mid]');if(!mk)return;const m=P.marks.find(x=>x.id===mk.dataset.mid);
  if(m&&m.type==='text'){const t=await ask('แก้ไขข้อความ','',{input:m.text});if(t){pushUndo();m.text=t;save();renderMarks()}}
});
stage.addEventListener('wheel',e=>{if(!curDwg())return;e.preventDefault();
  if(e.ctrlKey||e.metaKey){zoomAt(e.clientX,e.clientY,zoom*Math.exp(-e.deltaY*(e.deltaMode?0.05:0.0025)));return}
  const k=e.deltaMode===1?32:e.deltaMode===2?stage.clientHeight:1;let dx=e.deltaX*k,dy=e.deltaY*k;if(e.shiftKey&&!dx){dx=dy;dy=0}
  const av=sbAxis('v'),ah=sbAxis('h');panY=Math.min(av.max,Math.max(av.min,panY-dy));panX=Math.min(ah.max,Math.max(ah.min,panX-dx));applyT()},{passive:false});
['dragenter','dragover'].forEach(t=>stage.addEventListener(t,e=>{e.preventDefault();stage.classList.add('dragover')}));
['dragleave','drop'].forEach(t=>stage.addEventListener(t,e=>{e.preventDefault();stage.classList.remove('dragover')}));
stage.addEventListener('drop',e=>{if(e.dataTransfer.files.length)openInbox(e.dataTransfer.files,'ไฟล์ที่ลากมา')});
window.addEventListener('resize',()=>{if(curDwg())applyT()});
document.addEventListener('keydown',e=>{
  if(document.querySelector('.modal-bg')){if(e.key==='Escape')document.querySelector('.modal-bg [data-cancel]')?.click();return}
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  if(e.key===' '){spaceDown=true;e.preventDefault();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='Enter'&&poly){finishPoly();return}
  if(e.key==='Escape'){if(poly)cancelPoly();else if(mode!=='select')setMode('select');else{selId=selMark=null;renderPins();renderMarks();renderList()}return}
  if(e.key==='Delete'||e.key==='Backspace'){if(selMark){e.preventDefault();deleteMark(selMark)}else if(selId){e.preventDefault();deletePoint(selId)}return}
  const map={v:'select',p:'point',b:'pen',h:'hl',l:'line',a:'arrow',r:'rect',o:'ellipse',c:'cloud',t:'text',m:'measure',e:'eraser'};
  const k=map[e.key.toLowerCase()];if(k)setMode(k);
});
document.addEventListener('keyup',e=>{if(e.key===' ')spaceDown=false});

/* ---------- scrollbars ---------- */
function sbAxis(ax){const d=curDwg();const s=stage;const view=ax==='v'?s.clientHeight:s.clientWidth;const content=(ax==='v'?d.h:d.w)*zoom;const m=view*.4;const max=m,min=view-content-m;return{view,max,min,range:Math.max(0,max-min)}}
function updateSB(){
  const d=curDwg();['v','h'].forEach(ax=>{const sb=$('#sb'+ax.toUpperCase());if(!d){sb.style.display='none';return}sb.style.display='';
    const a=sbAxis(ax),track=ax==='v'?sb.clientHeight:sb.clientWidth,th=sb.firstElementChild;
    const tl=Math.max(30,track*a.view/(a.range+a.view));const pan=ax==='v'?panY:panX;
    const pos=a.range?Math.min(1,Math.max(0,(a.max-pan)/a.range))*(track-tl):0;
    if(ax==='v'){th.style.top=pos+'px';th.style.height=tl+'px'}else{th.style.left=pos+'px';th.style.width=tl+'px'}})
}
['v','h'].forEach(ax=>{
  const sb=$('#sb'+ax.toUpperCase()),th=sb.firstElementChild;let st=null;
  th.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();th.setPointerCapture(e.pointerId);st={c:ax==='v'?e.clientY:e.clientX,pan:ax==='v'?panY:panX}});
  th.addEventListener('pointermove',e=>{if(!st||!curDwg())return;const a=sbAxis(ax),track=ax==='v'?sb.clientHeight:sb.clientWidth,tl=ax==='v'?th.offsetHeight:th.offsetWidth;
    const dlt=(ax==='v'?e.clientY:e.clientX)-st.c;const k=a.range/Math.max(1,track-tl);const np=Math.min(a.max,Math.max(a.min,st.pan-dlt*k));if(ax==='v')panY=np;else panX=np;applyT()});
  th.addEventListener('pointerup',()=>st=null);th.addEventListener('pointercancel',()=>st=null);
  sb.addEventListener('pointerdown',e=>{if(e.target!==sb||!curDwg())return;e.stopPropagation();const r=th.getBoundingClientRect();const before=ax==='v'?e.clientY<r.top:e.clientX<r.left;const a=sbAxis(ax);const step=a.view*.85*(before?1:-1);
    if(ax==='v')panY=Math.min(a.max,Math.max(a.min,panY+step));else panX=Math.min(a.max,Math.max(a.min,panX+step));applyT()});
});

function addPoint(x,y){
  pushUndo();
  const p={id:uid(),no:nextNo(),drawingId:P.active,x,y,location:'',system:'HVAC',desc:'',action:'',status:'Open',inspector:P.header.inspector||'',date:today(),photos:pendingPhotos||[]};pendingPhotos=null;
  P.points.push(p);selId=p.id;save();renderPins();renderList();renderTabs();openPoint(p.id,true);
}
async function deletePoint(id){
  const p=P.points.find(x=>x.id===id);if(!p)return;
  if(!await ask('ลบ Point '+p.no,'ต้องการลบ Point นี้พร้อมรูปถ่ายใช่หรือไม่?',{ok:'ลบ',danger:true}))return;
  pushUndo();P.points=P.points.filter(x=>x.id!==id);if(selId===id)selId=null;save();renderPins();renderList();renderTabs();
}

  modal(`<div class="mh"><span class="no" style="background:${s.c}">${esc(p.no)}</span> Point ${esc(p.no)} <span class="sp"></span><span class="muted" style="font-weight:400">${esc((P.drawings.find(d=>d.id===p.drawingId)||{}).name||'')}</span></div>

    <div class="f full"><label>การแก้ไข / หมายเหตุ (Action / Remark)</label><textarea class="in" id="pAct" rows="2">${esc(p.action)}</textarea></div>
    <div class="f"><label>วันที่</label><input class="in" id="pDate" type="date" value="${esc(p.date)}"></div>
    <div class="f full"><label>ผู้ตรวจ / Inspector</label><input class="in" id="pIns" value="${esc(p.inspector)}"></div>
    <div class="f full"><label>รูปถ่ายหน้างาน (รูปแรกลงกรอบที่ 2 ของ Report · รูปถัดไปขึ้นหน้าใหม่)</label><div class="phs" id="phs"></div></div>
  </div>
  <div class="mf">${isNew?'':'<button class="btn red" id="pDel">ลบ Point</button>'}<span class="sp"></span><button class="btn" data-cancel>ยกเลิก</button><button class="btn pri" id="pSave">บันทึก</button></div>`,(m,close)=>{

/* ---------- image helpers ---------- */
function fileToDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
async function compressImage(file,maxSide,q,fmt='image/jpeg'){
  const url=await fileToDataURL(file);const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const s=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);

function drawPin(ctx,x,y,r,no,color,hl,alpha=1){
  ctx.save();ctx.globalAlpha=alpha;const cy=y-r*1.75;
  if(hl){ctx.beginPath();ctx.arc(x,cy,r*2.1,0,Math.PI*2);ctx.strokeStyle='#e53935';ctx.lineWidth=r*.32;ctx.stroke()}
  ctx.beginPath();ctx.moveTo(x,y);ctx.bezierCurveTo(x-r*.35,y-r*.55,x-r,cy+r*.6,x-r,cy);ctx.arc(x,cy,r,Math.PI,0);ctx.bezierCurveTo(x+r,cy+r*.6,x+r*.35,y-r*.55,x,y);ctx.closePath();
  ctx.fillStyle=color;ctx.fill();ctx.lineWidth=r*.16;ctx.strokeStyle='#fff';ctx.stroke();
  ctx.fillStyle='#fff';ctx.font=`700 ${r*(String(no).length>2?.8:1.05)}px Sarabun, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(no,x,cy+r*.05);ctx.restore();
}
async function renderOverview(d,maxSide=2600){

  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);drawMarksCanvas(x,d,s,0,0);
  const r=Math.max(c.width,c.height)*.0085;
  P.points.filter(p=>p.drawingId===d.id).sort((a,b)=>a.no-b.no).forEach(p=>drawPin(x,p.x*c.width,p.y*c.height,r,p.no,PINC,false));
  return {src:c.toDataURL('image/jpeg',.88),w:c.width,h:c.height,canvas:c};
}
async function renderCrop(p,aspect){
  const d=P.drawings.find(x=>x.id===p.drawingId);if(!d)return null;const im=await loadImg(d.src);
  let cw=d.w*(P.opts.cropPct/100),ch=cw/aspect;if(ch>d.h){ch=d.h;cw=ch*aspect}if(cw>d.w){cw=d.w;ch=cw/aspect}
  let cx=p.x*d.w-cw/2,cy=p.y*d.h-ch*0.6;cx=Math.max(0,Math.min(d.w-cw,cx));cy=Math.max(0,Math.min(d.h-ch,cy));
  const OW=1360,OH=Math.round(OW/aspect),k=OW/cw;const c=document.createElement('canvas');c.width=OW;c.height=OH;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,OW,OH);x.drawImage(im,cx,cy,cw,ch,0,0,OW,OH);drawMarksCanvas(x,d,k,cx,cy);

/* ---------- shared page plan ---------- */
function planPages(){
  const pts=ptsSorted(),O=P.opts,pages=[];
  if(O.keyplan)for(const d of P.drawings){if(pts.some(p=>p.drawingId===d.id))pages.push({kind:'key',d})}
  for(const p of pts){
    const fr=[];if(O.frame1==='location')fr.push({t:'loc',p});p.photos.forEach((src,i)=>fr.push({t:'photo',src,i}));
    const per=P.opts.cols==2?4:2;if(!fr.length)fr.push({t:'none'});if(fr.length===1)fr.push({t:'none'});
    for(let i=0;i<fr.length;i+=per)pages.push({kind:'pt',p,frames:fr.slice(i,i+per),cont:i>0});
  }
  return{pages,pts};
}
function pageSlots(){return P.opts.cols==2?[{r0:6,c0:1,c1:6},{r0:6,c0:6,c1:11},{r0:22,c0:1,c1:6},{r0:22,c0:6,c1:11}]:[{r0:6,c0:1,c1:11},{r0:22,c0:1,c1:11}]}

  const p=pg.p,fr=pg.frames,cap=i=>capOf(fr[i],p);
  const d1=`รายละเอียด: ${p.desc||'-'}`,d2=`การแก้ไข / หมายเหตุ: ${p.action||'-'}   |   ผู้ตรวจ: ${p.inspector||'-'}   |   วันที่: ${fmtDate(p.date)}`;
  if(P.opts.cols==2){const low=[cap(2),cap(3)].filter(Boolean).join(' · ');
    return[{row:21,c0:1,c1:6,text:cap(0)},{row:21,c0:6,c1:11,text:cap(1)},
      {row:37,c0:1,c1:11,text:pg.cont?`Point ${p.no} (ต่อ)${low?' — ภาพล่าง: '+low:''}`:`${d1}   |   ${d2}${low?'   [ภาพล่าง: '+low+']':''}`}]}
  return[{row:21,c0:1,c1:11,text:!pg.cont?d1+(cap(0)?`   [${cap(0)}]`:''):(cap(0)?`Point ${p.no} — ${cap(0)}`:'')},
    {row:37,c0:1,c1:11,text:!pg.cont?d2+(cap(1)?`   [${cap(1)}]`:''):(cap(1)?`Point ${p.no} — ${cap(1)}`:'')}];

function fitText(ctx,t,maxW,size,bold){let s=size;do{ctx.font=`${bold?700:400} ${s}px ${RFONT}`;if(ctx.measureText(t).width<=maxW)break;s-=1}while(s>9);return s}
function wrapLines(ctx,t,maxW,maxLines){
  const out=[];let line='';
  for(const ch of String(t)){const test=line+ch;if(ctx.measureText(test).width>maxW&&line){
      const sp=line.lastIndexOf(' ');if(sp>line.length*.5){out.push(line.slice(0,sp));line=line.slice(sp+1)+ch}else{out.push(line);line=ch}
      if(out.length===maxLines)break}else line=test}
  if(out.length<maxLines&&line)out.push(line);
  if(out.length===maxLines&&out.join('').length<String(t).replace(/ /g,'').length+out.length-1){const l=out[maxLines-1];out[maxLines-1]=l.slice(0,Math.max(0,l.length-1))+'…'}

}
function fitDraw(ctx,img,iw,ih,x0,y0,x1,y1,pad){const W=x1-x0-2*pad,H=y1-y0-2*pad,s=Math.min(W/iw,H/ih),w=iw*s,h=ih*s;ctx.drawImage(img,x0+pad+(W-w)/2,y0+pad+(H-h)/2,w,h)}

function keyPaper(d){const s=d.scale||{};let[w,h]=d.paperMM?[d.paperMM.w,d.paperMM.h]:paperDims(d,{paper:s.paper&&s.paper!=='auto'?s.paper:'A3',orient:s.orient||'auto'});const k=Math.max(1,420/Math.max(w,h));return[w*k,h*k]}

  const txt=(t,a,b,cc,dd,size,bold,center)=>{const pad=center?0:cw*.08;const s=fitText(x,t,cc-a-pad*2,Math.min(size,(dd-b)*.72),bold);x.fillStyle='#000';x.textBaseline='middle';x.textAlign=center?'center':'left';x.fillText(t,center?(a+cc)/2:a+pad,(b+dd)/2+1)};
  box(X(0),Y(0),X(3),Y(4));box(X(3),Y(0),X(8),Y(2));box(X(3),Y(2),X(8),Y(4));
  if(logoImg)fitDraw(x,logoImg,logoImg.naturalWidth,logoImg.naturalHeight,X(0),Y(0),X(3),Y(4),rh*.15);

  const Hh=P.header,lab=['Doc. No. :','Rev. :','Date :','Page :'],val=[Hh.docNo,Hh.rev,fmtDate(Hh.effDate),`${i+1} / ${N}`];
  for(let k=0;k<4;k++){box(X(8),Y(k),X(10),Y(k+1));box(X(10),Y(k),X(12),Y(k+1));txt(lab[k],X(8),Y(k),X(10),Y(k+1),rh*.75,true);txt(val[k]||'',X(10),Y(k),X(12),Y(k+1),rh*.75,false)}

async function addKeyPlanPdf(newPage,pg,i,N,pts){

async function checkShared(){
  try{if(!('caches' in window)||!/[?&]share=/.test(location.search))return;
    const c=await caches.open('drawnote-share');const ks=await c.keys();const files=[];
    for(const k of ks){const r=await c.match(k);const b=await r.blob();files.push(new File([b],decodeURIComponent(r.headers.get('X-Name')||'file'),{type:b.type}));await c.delete(k)}
    history.replaceState(null,'',location.pathname);if(files.length)openInbox(files,'LINE / แอปอื่น');
  }catch(e){console.error(e)}
}
async function pasteFromClipboard(){
  try{if(!navigator.clipboard||!navigator.clipboard.read)throw 0;const items=await navigator.clipboard.read();const files=[];
    for(const it of items){const t=it.types.find(x=>x.startsWith('image/'));if(t){const b=await it.getType(t);files.push(new File([b],'clipboard.'+t.split('/')[1],{type:t}))}}
    if(!files.length){toast('คลิปบอร์ดไม่มีรูป — ใน LINE กดค้างที่รูป → คัดลอก แล้วกดปุ่มนี้อีกครั้ง',5000);return}
    openInbox(files,'คลิปบอร์ด');
  }catch(e){toast('กด Ctrl+V (คอม) หรือแตะค้างบนแบบ → วาง (มือถือ) เพื่อวางรูปจาก LINE',5000)}
}

let LANG='th',DEVICE='auto',_trKeys=null;
const hasTh=s=>/[฀-๿]/.test(s);
function trText(s){if(!hasTh(s))return s;_trKeys=_trKeys||Object.keys(EN).sort((a,b)=>b.length-a.length);let o=s;
  for(const k of _trKeys){if(o.includes(k))o=o.split(k).join(k.length<=4?' '+EN[k]+' ':EN[k]);if(!hasTh(o))break}
  return o.replace(/ {2,}/g,' ').replace(/ ([,.:;)…])/g,'$1').replace(/\( /g,'(')}
const TR_SKIP='.u,#mk,#pins,script,style,textarea,option.u';
function trNode(n){
  if(n.nodeType===3){const p=n.parentElement;if(!p||p.closest(TR_SKIP))return;
    if(LANG==='en'){const orig=n.__th!=null?n.__th:n.nodeValue;const t=trText(orig);if(t!==orig){n.__th=orig;if(n.nodeValue!==t)n.nodeValue=t}}
    else if(n.__th!=null){n.nodeValue=n.__th;n.__th=null}return}
  if(n.nodeType!==1||n.closest(TR_SKIP))return;
  for(const a of['title','placeholder']){if(!n.hasAttribute(a))continue;const k='__th_'+a;
    if(LANG==='en'){const orig=n[k]!=null?n[k]:n.getAttribute(a);const t=trText(orig);if(t!==orig){n[k]=orig;n.setAttribute(a,t)}}
    else if(n[k]!=null){n.setAttribute(a,n[k]);n[k]=null}}
  n.childNodes.forEach(trNode);
}
new MutationObserver(ms=>{if(LANG!=='en')return;for(const m of ms)m.addedNodes.forEach(trNode)}).observe(document.body,{childList:true,subtree:true});
function setLang(l){LANG=l;document.documentElement.lang=l;trNode(document.body);document.querySelectorAll('#langSeg button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));try{localStorage.setItem('drawnote-lang',l)}catch(e){}}
function resolveDevice(){if(DEVICE!=='auto')return DEVICE;const w=innerWidth,coarse=matchMedia('(pointer:coarse)').matches;return w<700?'mobile':(coarse||w<1100)?'tablet':'desktop'}
function applyDevice(){const d=resolveDevice();document.body.classList.remove('dev-desktop','dev-tablet','dev-mobile');document.body.classList.add('dev-'+d);$('#devSel').value=DEVICE;if(curDwg())applyT()}
function setDevice(v){DEVICE=v;try{localStorage.setItem('drawnote-device',v)}catch(e){}applyDevice()}
window.addEventListener('resize',()=>{if(DEVICE==='auto')applyDevice()});

    <div class="f full"><label>โลโก้ (ช่องซ้ายบน — ไม่ใส่ก็ได้)</label><div style="display:flex;gap:8px;align-items:center"><div class="logo-prev" id="lgP"></div><button class="btn sm" id="lgU">เลือกรูป</button><button class="btn sm red" id="lgD">ลบ</button></div></div>
    <div class="f full"><label>รูปแบบหน้า Report</label><select class="in" id="sCols"><option value="1" ${O.cols!=2?'selected':''}>1 คอลัมน์ — 2 กรอบรูป/หน้า (ภาพใหญ่)</option><option value="2" ${O.cols==2?'selected':''}>2 คอลัมน์ — 4 กรอบรูป/หน้า (ประหยัดหน้า)</option></select></div>
    <div class="f"><label>กรอบรูปที่ 1</label><select class="in" id="sF1"><option value="location" ${O.frame1==='location'?'selected':''}>ตำแหน่งบนแบบ (ครอปจาก Drawing)</option><option value="photo" ${O.frame1==='photo'?'selected':''}>รูปถ่ายหน้างาน</option></select></div>
    <div class="f"><label>ระยะครอปตำแหน่ง</label><select class="in" id="sCrop">${[[15,'ใกล้มาก (15%)'],[25,'ใกล้ (25%)'],[30,'ปกติ (30%)'],[45,'กว้าง (45%)'],[65,'กว้างมาก (65%)']].map(([v,t])=>`<option value="${v}" ${+O.cropPct===v?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="f full"><label><input type="checkbox" id="sMk" ${O.exportMarks!==false?'checked':''}> แสดง Markup (เส้น/ข้อความ/ระยะที่วัด) ใน Report และ PNG</label></div>
    <div class="f full"><label><input type="checkbox" id="sKey" ${O.keyplan?'checked':''}> ใส่หน้า Drawing Key Plan ไว้หน้าแรก (แผ่นใหญ่ตามขนาดกระดาษแบบ A3/A1 แนวนอน พร้อมหมุดทุกจุด)</label></div>
  </div><div class="mf"><span class="sp"></span><button class="btn" data-cancel>ยกเลิก</button><button class="btn pri" id="sSave">บันทึก</button></div>`,(m,close)=>{
    const lp=()=>{m.querySelector('#lgP').style.backgroundImage=logo?`url(${logo})`:'none'};lp();
    const fi=document.createElement('input');fi.type='file';fi.accept='image/*';fi.onchange=async()=>{if(fi.files[0]){logo=await compressImage(fi.files[0],600,1,'image/png');lp()}};
    m.querySelector('#lgU').onclick=()=>fi.click();m.querySelector('#lgD').onclick=()=>{logo=null;lp()};
    m.querySelector('[data-cancel]').onclick=close;
    m.querySelector('#sSave').onclick=()=>{
      P.name=m.querySelector('#sName').value.trim()||P.name;
      Object.assign(H,{title:m.querySelector('#sTitle').value.trim(),docNo:m.querySelector('#sDoc').value.trim(),rev:m.querySelector('#sRev').value.trim(),effDate:m.querySelector('#sEff').value,inspector:m.querySelector('#sIns').value.trim(),logo});
      Object.assign(O,{frame1:m.querySelector('#sF1').value,cropPct:+m.querySelector('#sCrop').value,keyplan:m.querySelector('#sKey').checked,exportMarks:m.querySelector('#sMk').checked,cols:+m.querySelector('#sCols').value});renderExpInfo();
      close();save();persist().then(renderProjSel);
    };
  });
}

/* ---------- projects ---------- */
async function switchProject(id){
  const p=await getProject(id);if(!p){toast('ไม่พบโครงการ');return}
  imgCache.clear();P=normalize(p);selMark=null;cancelPoly();selId=null;undoStack=[];$('#dwg').dataset.id='';renderAll();
  try{localStorage.setItem('dwg-annot-last',P.id)}catch(e){}
}
async function createProject(){
  const n=await ask('โครงการใหม่','ตั้งชื่อโครงการ (แยกแบบและ Report ตามโครงการ)',{input:'',ok:'สร้าง'});if(!n)return;
  P=newProject(n);selId=null;undoStack=[];$('#dwg').dataset.id='';await persist();renderAll();
}

/* ---------- wiring ---------- */
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{setMode(b.dataset.mode);$('#drawMenu').classList.remove('open')});
$('#bDraw').onclick=e=>{e.stopPropagation();const mn=$('#drawMenu'),r=$('#bDraw').getBoundingClientRect();mn.style.left=Math.min(r.left,innerWidth-210)+'px';mn.style.top=(r.bottom+4)+'px';mn.classList.toggle('open')};
window.addEventListener('resize',()=>$('#drawMenu').classList.remove('open'));$('#toolcard').addEventListener('scroll',()=>$('#drawMenu').classList.remove('open'));
document.addEventListener('click',e=>{if(!e.target.closest('.dd'))$('#drawMenu').classList.remove('open')});
function renderSwatches(){$('#swatches').innerHTML=COLORS.map(c=>`<button data-c="${c}" class="${c===curColor?'on':''}" style="background:${c}" title="${c}"></button>`).join('')}
renderSwatches();$('#swatches').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;curColor=b.dataset.c;renderSwatches();
  if(selMark){const m=P.marks.find(x=>x.id===selMark);if(m){pushUndo();m.color=curColor;save();renderMarks()}}else if(!NONSEL.includes(mode)||mode==='eraser')setMode('pen')};
$('#sizes').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;curSize=b.dataset.s;$('#sizes').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  if(selMark){const m=P.marks.find(x=>x.id===selMark);if(m){pushUndo();m.size=curSize;save();renderMarks()}}};
$('#bEye').onclick=()=>{showMarks=!showMarks;$('#bEye').textContent=showMarks?'👁 ซ่อน Markup':'👁 แสดง Markup';renderMarks()};
$('#unitSeg').onclick=e=>{const b=e.target.closest('[data-u]');if(!b)return;P.opts.unit=b.dataset.u;save();renderScaleCtl();renderMarks();if(poly)drawPoly()};
$('#scApply').onclick=applyPaperScale;$('#scN').onkeydown=e=>{if(e.key==='Enter')applyPaperScale()};
$('#scCal').onclick=()=>{setMode('calib');toast('ลากเส้นทับระยะที่รู้ค่าจริงบนแบบ',3500)};
$('#pbOk').onclick=finishPoly;$('#pbX').onclick=cancelPoly;
setMode('select');
$('#zIn').onclick=()=>zoomCenter(1.25);$('#zOut').onclick=()=>zoomCenter(.8);$('#zFit').onclick=fit;
$('#bUpload').onclick=$('#bUpload2').onclick=()=>$('#fileDwg').click();
$('#fileDwg').onchange=e=>{const f=[...e.target.files];e.target.value='';importDrawings(f)};
$('#bUndo').onclick=undo;
const guarded=fn=>async()=>{if(busyOn)return;busy(true);try{await fn()}catch(e){console.error(e);toast('เกิดข้อผิดพลาด: '+(e.message||e),5000)}finally{busy(false)}};
$('#bExcel').onclick=guarded(exportExcel);
$('#bSettings').onclick=openSettings;
$('#bNewProj').onclick=createProject;
$('#projSel').onchange=e=>switchProject(e.target.value);
$('#fSearch').oninput=renderList;$('#fCur').onchange=renderList;
$('#bDelProj').onclick=async()=>{
  if(!await ask('ลบโครงการ',`ลบ “${P.name}” พร้อมแบบ, Point และรูปทั้งหมด? (แนะนำส่งออกไฟล์งานก่อน)`,{ok:'ลบโครงการ',danger:true}))return;
  await delProjectStore(P.id);
  if(META.length)await switchProject(META[0].id);else{P=newProject('โครงการ 1');await persist();renderAll()}
};
$('#bPng').onclick=async()=>{const d=curDwg();if(!d){toast('ยังไม่มีแบบ');return}toast('กำลังสร้างภาพ…',0);const ov=await renderOverview(d,5000);ov.canvas.toBlob(b=>saveFile(`${P.name}_${d.name}_marked.png`,b),'image/png')};
$('#bSave').onclick=async()=>{clearTimeout(saveT);P.updated=Date.now();await persist();toast(db?'บันทึกงานแล้ว — เปิดทำต่อได้จาก “งานที่บันทึกไว้”':'เบราว์เซอร์นี้บันทึกในเครื่องไม่ได้ — กรุณาส่งออกไฟล์งาน',3500);if(!db)exportWork(P)};
$('#bFiles').onclick=openFiles;$('#bPaste').onclick=pasteFromClipboard;
$('#langSeg').onclick=e=>{const b=e.target.closest('[data-l]');if(b)setLang(b.dataset.l)};$('#devSel').onchange=e=>setDevice(e.target.value);
$('#bList').onclick=()=>document.body.classList.toggle('list-open');
try{DEVICE=localStorage.getItem('drawnote-device')||'auto'}catch(e){}applyDevice();
try{const l=localStorage.getItem('drawnote-lang');if(l==='en')setLang('en')}catch(e){}$('#bPdf').onclick=guarded(exportPdfReport);$('#bPdfDwg').onclick=guarded(exportPdfDrawings);
$('#colSeg').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;P.opts.cols=+b.dataset.c;save();renderExpInfo();toast(P.opts.cols==2?'Report: 2 คอลัมน์ (4 รูป/หน้า)':'Report: 1 คอลัมน์ (2 รูป/หน้า)')};
window.addEventListener('error',e=>{console.error(e.error||e.message);toast('เกิดข้อผิดพลาด: '+(e.message||'unknown')+' — งานยังถูกบันทึกอยู่',5000)});
window.addEventListener('unhandledrejection',e=>{console.error(e.reason);toast('เกิดข้อผิดพลาด: '+((e.reason&&e.reason.message)||e.reason||'unknown'),5000)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&saveT){clearTimeout(saveT);persist()}});
window.addEventListener('pagehide',()=>{if(saveT){clearTimeout(saveT);persist()}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();$('#bSave').click()}},true);
$('#fileJson').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(f)await importWorkFile(f)};
$('#tabs').addEventListener('click',async e=>{
  if(e.target.closest('#tabAdd')){$('#fileDwg').click();return}
  const x=e.target.closest('[data-x]');
  if(x){const d=P.drawings.find(d=>d.id===x.dataset.x);const n=P.points.filter(p=>p.drawingId===d.id).length;
    if(!await ask('ลบแบบ',`ลบแบบ “${d.name}”${n?` และ ${n} Point บนแบบนี้`:''}?`,{ok:'ลบ',danger:true}))return;
    P.points=P.points.filter(p=>p.drawingId!==d.id);P.marks=P.marks.filter(m=>m.drawingId!==d.id);P.drawings=P.drawings.filter(z=>z.id!==d.id);if(P.active===d.id)P.active=P.drawings[0]?.id||null;undoStack=[];save();$('#dwg').dataset.id='';renderAll();return}
  const t=e.target.closest('.tab[data-id]');if(t&&t.dataset.id!==P.active){P.active=t.dataset.id;save();renderTabs();renderStage();if($('#fCur').checked)renderList()}
});
$('#tabs').addEventListener('dblclick',async e=>{const t=e.target.closest('.tab[data-id]');if(!t)return;const d=P.drawings.find(z=>z.id===t.dataset.id);const n=await ask('เปลี่ยนชื่อแบบ','',{input:d.name});if(n){d.name=n;save();renderTabs();renderList()}});
$('#list').addEventListener('click',e=>{const c=e.target.closest('.card');if(!c)return;const p=P.points.find(x=>x.id===c.dataset.id);if(!p)return;
  if(selId===p.id){openPoint(p.id);return}selId=p.id;centerOn(p);renderPins();renderList()});

/* ---------- boot ---------- */
(async()=>{
  db=await idbOpen();await loadMeta();
  let last=null;try{last=localStorage.getItem('dwg-annot-last')}catch(e){}
  const id=(META.find(m=>m.id===last)||META[0]||{}).id;
  if(id){await switchProject(id)}else{P=newProject('โครงการ 1');await persist();renderAll()}
  checkShared();
  if(!db)toast('เบราว์เซอร์นี้เก็บข้อมูลอัตโนมัติไม่ได้ — ใช้ “📂 งานที่บันทึกไว้ → ส่งออกไฟล์งาน” เพื่อเก็บงาน',6000);
})();
</script>
</body>
</html>
